<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else</title>
</head>
<body>
    

    <script>

        let nameJS = prompt('Qual é o nome oficial do JavaScript?', 'ECMAScript')

        if (nameJS == 'ECMAScript') {
            alert('Correto!')
        } else {
            alert('Errado, o nome correto é ECMAScript.')
        }

    </script>
</body>
</html>
