<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else</title>
</head>
<body>
    

    <script>

        let age = Number(prompt('Digite sua idade: '))

        if (age >= 14 && age <= 90) {
            alert("Você tem entre 14 e 90 anos!")
        }

    </script>
</body>
</html>
