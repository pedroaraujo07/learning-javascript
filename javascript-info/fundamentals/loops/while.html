<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    

    <script>

        let i = 0
        while (i < 3) {
            alert(`Número ${i}!`)
            i++
        }

    </script>
</body>
</html>
