<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    

    <script>

        while (true) {
            let i = prompt('Digite um número maior que 100')
            if (i > 100 || i == null || i == '') {
                break
            }
        }
        
        
    </script>
</body>
</html>
