<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função</title>
</head>
<body>
    

    <script>

        function checkAge(age) {
            return (age > 18) ? true : confirm('Did parents allow you?')    
        }

        let age = prompt('Your age: ')
        checkAge(age)
        
    </script>
</body>
</html>
