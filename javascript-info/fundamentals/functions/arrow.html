<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função</title>
</head>
<body>
    

    <script>

        function ask(question, yes, no) {
            if (confirm(question)) yes()
            else no()
        }

        ask(
            "Do you agree?",
            () => alert("You agreed.") ,
            () => alert("You canceled the execution.") 
        )
        
    </script>
</body>
</html>
