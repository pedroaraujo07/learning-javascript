<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função</title>
</head>
<body>
    

    <script>

        function pow(x,n) {
            let xpow = x
            for (let i = 1; i < n; i++) {
                xpow *= x
            }

            return xpow
        }

        let x = +prompt('x:')
        let n = +prompt('n:')


        if (n < 1) {
            alert(`Power ${n} is not supported, use a positive integer`);
        } else {
            alert(`${x} in power ${n}:  ${pow(x, n)}`)
        }
        
    </script>
</body>
</html>
