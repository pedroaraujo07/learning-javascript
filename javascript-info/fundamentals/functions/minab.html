<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Função</title>
</head>
<body>
    

    <script>

        function getMin(a, b) {
            if (a < b) return a
            else return b
        }

        let a = +prompt("a:")
        let b = +prompt("b:")

        alert(`The least: ${getMin(a, b)}`)
        
    </script>
</body>
</html>
