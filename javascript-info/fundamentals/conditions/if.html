<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    

    <script>

        const navegador = navigator.userAgent

        if (navegador.includes("Edge")) {
            alert("Você está usando o Microsoft Edge!")
        } 

        else if (navegador.includes("Chrome")) {
            alert("Você está usando o Google Chrome!")
        }

        else {
            alert("Você está usando outro navegador.")
        }


        
        
    </script>
</body>
</html>
