<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else</title>
</head>
<body>
    

    <script>

        let num = Number(prompt('Digite um número: '))

        if (num > 0) {
            alert(1)
        } 

        else if (num < 0) {
            alert(-1)
        } 

        else {
            alert(0)
        }

    </script>
</body>
</html>
