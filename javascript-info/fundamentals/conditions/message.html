<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else</title>
</head>
<body>
    

    <script>

        let login = prompt('Seu cargo: ')

        let message = (login == 'Funcionário') ? 'Olá' :
            (login == 'Diretor') ? 'Saudações' :
            (login == '') ? 'Sem Login' : ''

        alert(message)

    </script>
</body>
</html>
