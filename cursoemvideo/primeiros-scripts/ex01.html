<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript00</title>
    
    <style>

        body {
            background-color: lightblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    </style>

</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Sai zika.</p>

    <script>

        window.alert("Meu primeiro script em JavaScript!") // Mostra uma mensagem na tela
        window.confirm("Você gosta de TI?") // Mostra uma mensagem na tela com a opção de ok ou cancelar
        window.prompt("Qual é seu esporte favorito?") // Mostra uma mensagem e abre uma caixa de texto para o usuário

    </script>

</body>
</html>
