<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som+</title>

    <style>

        body {
            background-color: lightgrey;
        }

        div {
            margin-top: 10px;
        }

    </style>

</head>
<body>
    <h1>Quer somar?</h1>
    <input type="number" name="input1" id="input1" placeholder="Digite um número">
    <input type="number" name="input2" id="input2" placeholder="Digite outro número">
    <input type="button" value="Somar" onclick="somar()">
    <div id="resultado">Resultado: </div>

    <script>

        function somar() {
            var tn1 = window.document.getElementById('input1')
            var tn2 = window.document.getElementById('input2')
            var n1 = Number(tn1.value)
            var n2 = Number(tn2.value)
            var soma = n1 + n2
            var resultado = window.document.getElementById('resultado')
            resultado.innerHTML = `Resultado: ${soma}`
        }

    </script>

</body>
</html>
