<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>var JS</title>

    <style>

        body {
            font: normal 1.2em 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    </style>

</head>
<body>

    <script>

        var carro = window.prompt('Qual é seu carro?')
        document.writeln(`O seu carro é o <strong>${carro}</strong> e tem ${carro.length} letras. <br>`)
        document.writeln(`O nome do seu carro em maiúsculo é ${carro.toUpperCase()}. <br>`)
        document.writeln(`O nome do seu carro em minúsculo é ${carro.toLowerCase()}.`)

    </script>
    
</body>
</html>
